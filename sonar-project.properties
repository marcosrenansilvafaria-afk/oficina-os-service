sonar.projectKey=oficina-os-service
sonar.organization=marcosrenansilvafaria-afk

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.steps.ts
sonar.exclusions=src/generated/**,**/*.spec.ts,dist/**,coverage/**

sonar.javascript.lcov.reportPaths=coverage/critical/lcov.info
sonar.sourceEncoding=UTF-8

