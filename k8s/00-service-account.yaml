apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-os-service
  namespace: oficina
  annotations:
    # IRSA: identidade de runtime do pod (distinta da role de CI/CD que faz o
    # deploy). Concede sns:Publish/sqs:ReceiveMessage via
