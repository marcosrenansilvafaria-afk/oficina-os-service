apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-os-service
  namespace: oficina
  labels:
    app: oficina-os-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-os-service
  template:
    metadata:
      labels:
        app: oficina-os-service
    spec:
      serviceAccountName: oficina-os-service
      containers:
        - name: api
          image: "${image_registry}oficina-os-service:${image_tag}"
          imagePullPolicy: ${image_pull_policy}
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: oficina-os-service-config
            - secretRef:
                name: oficina-os-service-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
